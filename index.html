<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>매물콕 · 주소가 이전되었습니다</title>
<meta http-equiv="refresh" content="0; url=https://maemulcok.github.io/">
<link rel="canonical" href="https://maemulcok.github.io/">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:,">
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    display:flex;align-items:center;justify-content:center;
    padding:24px;
    background:#f6f7f9;
    color:#111827;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","맑은 고딕",sans-serif;
    -webkit-text-size-adjust:100%;
  }
  .box{
    width:100%;max-width:400px;
    background:#fff;
    border:1px solid #e5e7eb;
    border-radius:16px;
    padding:32px 26px 28px;
    text-align:center;
    box-shadow:0 1px 2px rgba(17,24,39,.04);
  }
  .mark{
    width:46px;height:46px;margin:0 auto 16px;
    border-radius:12px;
    background:#111827;color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:20px;font-weight:700;letter-spacing:-.5px;
  }
  h1{margin:0 0 10px;font-size:18px;font-weight:700;letter-spacing:-.3px}
  p{margin:0 0 22px;font-size:14px;line-height:1.65;color:#4b5563}
  p b{color:#111827;font-weight:600}
  a.go{
    display:block;
    padding:13px 18px;
    border-radius:10px;
    background:#111827;color:#fff;
    font-size:15px;font-weight:600;text-decoration:none;
  }
  a.go:active{background:#000}
  .addr{margin:16px 0 0;font-size:12px;color:#9ca3af;word-break:break-all}
</style>
<script>
  (function () {
    var target = "https://maemulcok.github.io/" + location.search + location.hash;
    location.replace(target);
    setTimeout(function () {
      var a = document.getElementById("go");
      if (a) { a.href = target; }
    }, 0);
  })();
</script>
</head>
<body>
  <div class="box">
    <div class="mark">콕</div>
    <h1>주소가 이전되었습니다</h1>
    <p>매물콕이 <b>maemulcok.github.io</b>로 옮겼습니다.<br>잠시 후 새 주소로 자동 이동합니다.</p>
    <a class="go" id="go" href="https://maemulcok.github.io/">새 주소로 이동하기</a>
    <p class="addr">maemulcok.github.io</p>
  </div>
</body>
</html>
